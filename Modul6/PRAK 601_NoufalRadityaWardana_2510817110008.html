<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Raditya</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>

  <style>
    :root {
      --color-bg: #f9f8f6;
      --color-text: #1a1a1a;
      --color-muted: #888;
      --color-border: #ddd;
      --font-display: 'Playfair Display', serif;
      --font-body: 'Lato', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-body);
      font-weight: 300;
    }

    /* CORNER BRACKETS */
    .page-wrapper {
      position: relative;
    }
    .corner-frame {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 12px;
      pointer-events: none;
      z-index: 9999;
    }
    .corner-frame::before,
    .corner-frame::after,
    .corner-frame > span::before,
    .corner-frame > span::after {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
    }
    /* top-left */
    .corner-frame::before {
      top: 0; left: 0;
      border-top: 2.5px solid #111;
      border-left: 2.5px solid #111;
    }
    /* top-right */
    .corner-frame::after {
      top: 0; right: 0;
      border-top: 2.5px solid #111;
      border-right: 2.5px solid #111;
    }
    /* bottom-left */
    .corner-frame > span::before {
      bottom: 0; left: 0;
      border-bottom: 2.5px solid #111;
      border-left: 2.5px solid #111;
    }
    /* bottom-right */
    .corner-frame > span::after {
      bottom: 0; right: 0;
      border-bottom: 2.5px solid #111;
      border-right: 2.5px solid #111;
    }

    /* NAVBAR */
    .navbar {
      background: var(--color-bg);
      border-bottom: 1px solid var(--color-border);
      padding: 16px 32px;
    }
    .navbar-brand {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--color-text) !important;
      letter-spacing: 0.5px;
    }
    .navbar-nav .nav-link {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--color-muted) !important;
      padding: 7px 20px !important;
      border-radius: 50px;
      border: 1px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    .navbar-nav .nav-link:hover { color: var(--color-text) !important; }
    .navbar-nav .nav-link.active {
      color: var(--color-text) !important;
      border-color: var(--color-border);
    }
    .navbar-toggler { border: none; box-shadow: none !important; }

    /* HERO */
    .hero { text-align: center; padding: 72px 20px 40px; }
    .hero__greeting {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 700;
      line-height: 1.3;
    }
    .hero__sub {
      font-family: var(--font-display);
      font-style: italic;
      font-size: clamp(0.95rem, 2vw, 1.15rem);
      margin-top: 6px;
    }
    .hero__desc {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-top: 14px;
    }

    /* FILTER TABS */
    .filter-tabs {
      display: flex;
      justify-content: center;
      gap: 4px;
      flex-wrap: wrap;
      margin: 36px 0 28px;
    }
    .filter-btn {
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.5px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--color-muted);
      padding: 7px 22px;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-btn.active {
      background: transparent;
      color: var(--color-text);
      border-color: var(--color-border);
      font-weight: 700;
    }
    .filter-btn:hover { color: var(--color-text); }

    /* GALLERY GRID */
    .gallery-section { padding: 0 20px 60px; }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(4, 200px);
      gap: 6px;
      justify-content: center;
    }


    .gallery-item {
      position: relative;
      overflow: hidden;
      width: 200px;
      height: 200px;
      background: #ddd;
      cursor: pointer;
    }
    .gallery-item img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }
    .gallery-item:hover img { transform: scale(1.07); }

    .gallery-item__overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0);
      transition: background 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gallery-item:hover .gallery-item__overlay { background: rgba(0,0,0,0.35); }
    .gallery-item__overlay i {
      color: #fff;
      font-size: 1.6rem;
      opacity: 0;
      transform: scale(0.7);
      transition: all 0.3s ease;
    }
    .gallery-item:hover .gallery-item__overlay i { opacity: 1; transform: scale(1); }

    /* LIGHTBOX */
    .lightbox-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }
    .lightbox-backdrop.show { display: flex; }
    .lightbox-img {
      max-width: 88vw;
      max-height: 85vh;
      object-fit: contain;
    }
    .lightbox-close {
      position: absolute;
      top: 20px; right: 28px;
      font-size: 2rem;
      color: #fff;
      cursor: pointer;
      background: none;
      border: none;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .lightbox-close:hover { opacity: 1; }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 40px 20px 50px;
      border-top: 1px solid var(--color-border);
    }
    .footer-brand {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 700;
    }
    .footer-copy {
      font-size: 0.7rem;
      color: var(--color-muted);
      margin-top: 4px;
    }
    .footer-social {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 18px;
    }
    .footer-social a {
      color: var(--color-muted);
      font-size: 1.1rem;
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-social a:hover { color: var(--color-text); }

    /* SCROLL FADE-IN */
    .fade-up {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.55s ease, transform 0.55s ease;
    }
    .fade-up.visible { opacity: 1; transform: translateY(0); }
  </style>
</head>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Scrollbar width compensation for right corners
    const scrollbarW = window.innerWidth - document.documentElement.clientWidth;
    document.querySelectorAll('.corner--tr, .corner--br').forEach(el => {
      el.style.right = (16 + scrollbarW) + 'px';
    });

    // Scroll fade-in
    const fadeEls = document.querySelectorAll('.fade-up');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((e, i) => {
        if (e.isIntersecting) {
          setTimeout(() => e.target.classList.add('visible'), i * 60);
          observer.unobserve(e.target);
        }
      });
    }, { threshold: 0.08 });
    fadeEls.forEach(el => observer.observe(el));

    // Filter tabs
    const filterBtns = document.querySelectorAll('.filter-btn');
    const galleryItems = document.querySelectorAll('.gallery-item');
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filter = btn.dataset.filter;
        galleryItems.forEach(item => {
          item.style.display = (filter === 'all' || item.dataset.category === filter) ? '' : 'none';
        });
      });
    });

    // Lightbox
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    galleryItems.forEach(item => {
      item.addEventListener('click', () => {
        lightboxImg.src = item.querySelector('img').src;
        lightbox.classList.add('show');
      });
    });
    document.getElementById('lightboxClose').addEventListener('click', () => lightbox.classList.remove('show'));
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) lightbox.classList.remove('show'); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') lightbox.classList.remove('show'); });
  </script>
